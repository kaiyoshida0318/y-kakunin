<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表示確認くん｜ヤフショ表示チェッカー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf7f2;
    --panel: #ffffff;
    --border: #e8e3da;
    --text: #2a2825;
    --text-soft: #7a766e;
    --accent: #e07856;
    --accent-deep: #c8553d;
    --accent-soft: #fbeae3;
    --success: #6b9450;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
  }
  body {
    font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 20px 60px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  /* ===== ヘッダー ===== */
  header {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 22px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow);
    flex-wrap: wrap;
  }
  .logo { height: 40px; width: auto; display: block; }
  @media (max-width: 480px) { .logo { height: 32px; } }
  .version {
    flex: none; font-size: 11px; font-weight: 700; color: var(--text-soft);
    background: #f0ece4; padding: 4px 11px; border-radius: 999px; white-space: nowrap;
  }

  /* ===== パネル ===== */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .panel-title {
    font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 9px;
  }
  .panel-title::before {
    content: ''; width: 4px; height: 15px; background: var(--accent); border-radius: 2px;
  }
  .panel-note { font-size: 12px; color: var(--text-soft); }
  .panel-body { padding: 22px; }

  .lead { color: var(--text-soft); font-size: 13px; margin: -4px 0 16px; }

  /* ===== ドロップゾーン ===== */
  .drop {
    display: block;
    background: #fdfcfa;
    border: 2px dashed #d8d0c4;
    border-radius: 10px;
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.drag { border-color: var(--accent); background: var(--accent-soft); }
  .drop .icon { font-size: 38px; line-height: 1; }
  .drop .big { font-size: 16px; font-weight: 700; margin-top: 10px; color: var(--text); }
  .drop .small { font-size: 13px; color: var(--text-soft); margin-top: 5px; }
  .drop input { display: none; }

  /* ===== サイズ調整コントロール ===== */
  .size-control {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .size-control .sc-label { font-size: 12px; color: var(--text-soft); font-weight: 600; }
  .stepper {
    display: flex; align-items: center; gap: 0;
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff;
  }
  .stepper button {
    font: inherit; font-size: 18px; font-weight: 700; line-height: 1;
    width: 34px; height: 34px; border: none; background: #fdfcfa; color: var(--accent-deep);
    cursor: pointer; transition: background .12s;
  }
  .stepper button:hover { background: var(--accent-soft); }
  .stepper button:active { background: #f2ddd2; }
  .stepper input {
    width: 68px; height: 34px; border: none; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    text-align: center; font: inherit; font-size: 14px; font-weight: 700; color: var(--text);
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper .unit { font-size: 12px; color: var(--text-soft); padding: 0 10px 0 4px; }

  .calib-hint {
    font-size: 12px; color: var(--text-soft); margin-bottom: 14px;
    background: #fdfcfa; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
  }
  .calib-hint strong { color: var(--accent-deep); }

  /* ===== ギャラリー（横並び） ===== */
  .gallery {
    display: flex; gap: 18px; overflow-x: auto; padding-bottom: 10px;
    align-items: flex-start;
  }
  .gallery::-webkit-scrollbar { height: 9px; }
  .gallery::-webkit-scrollbar-track { background: #f2efe8; border-radius: 5px; }
  .gallery::-webkit-scrollbar-thumb { background: #d4ccbf; border-radius: 5px; }

  .card {
    flex: 0 0 auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  .preview {
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.16);
    position: relative;
  }
  .preview img { max-width: 100%; max-height: 100%; display: block; }
  .card-remove {
    position: absolute; top: 6px; right: 6px;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; border: none; cursor: pointer;
    font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: background .12s;
  }
  .card-remove:hover { background: rgba(200,60,40,.9); }
  .card-caption {
    font-size: 11px; color: var(--text-soft);
    display: flex; flex-direction: column; gap: 2px;
    max-width: 100%;
  }
  .card-caption .fname {
    color: var(--text); font-weight: 600; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-caption .dim { font-variant-numeric: tabular-nums; }
  .tag {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-top: 2px; width: fit-content;
  }
  .tag.warn { background: var(--accent-soft); color: var(--accent-deep); }
  .tag.ok { background: #e7f2dc; color: var(--success); }

  .btn {
    font: inherit; font-weight: 700; font-size: 13px; border: none; border-radius: 8px;
    cursor: pointer; padding: 8px 16px; transition: all .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #f5f3ee; }

  .footer-note { margin-top: 8px; font-size: 12px; color: var(--text-soft); text-align: center; }
</style>
</head>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">画像をアップロード</div>
        <button class="btn btn-secondary" id="clearAll" style="display:none;">すべてクリア</button>
      </div>
      <div class="panel-body">
        <p class="lead">楽天用の画像を、ヤフショだとどう見えるか（左右の黒帯）を確認できます。複数まとめてドラッグ＆ドロップOK。横に並べて見比べられます。</p>
        <label class="drop" id="drop">
          <div class="icon">🖼️</div>
          <div class="big">ここに画像をドラッグ＆ドロップ（複数OK）</div>
          <div class="small">またはクリックしてファイルを選択（PC内には保存されません）</div>
          <input type="file" id="file" accept="image/*" multiple>
        </label>
      </div>
    </div>

    <div class="panel" id="result" style="display:none;">
      <div class="panel-header">
        <div class="panel-title">ヤフショでの見え方</div>
        <div class="size-control">
          <span class="sc-label">枠サイズ</span>
          <div class="stepper">
            <button type="button" id="sizeMinus" aria-label="小さく">−</button>
            <input type="number" id="sizeInput" value="300" min="120" max="800" step="10">
            <button type="button" id="sizePlus" aria-label="大きく">＋</button>
          </div>
          <span class="unit" style="font-size:12px;color:var(--text-soft);">px</span>
        </div>
      </div>
      <div class="panel-body">
        <div class="calib-hint">
          📱 <strong>スマホの表示に合わせるコツ：</strong>お使いのスマホで実際に見える画像の幅（px）に「枠サイズ」を合わせると、実際の見え方に近い状態で確認できます。＋−で微調整してください。
        </div>
        <div class="gallery" id="gallery"></div>
      </div>
    </div>

    <div class="footer-note">表示確認くん v2.0（2026.07.31）— 画像はブラウザ内だけで処理され、どこにも送信されません。</div>

<script>
(function () {
  var drop = document.getElementById('drop');
  var fileInput = document.getElementById('file');
  var result = document.getElementById('result');
  var gallery = document.getElementById('gallery');
  var clearAllBtn = document.getElementById('clearAll');
  var sizeInput = document.getElementById('sizeInput');
  var sizeMinus = document.getElementById('sizeMinus');
  var sizePlus = document.getElementById('sizePlus');

  var MIN = 120, MAX = 800, STEP = 10;
  var items = []; // {id, url, w, h}
  var idc = 0;

  // 保存された枠サイズを復元
  try {
    var saved = localStorage.getItem('hyoji:size');
    if (saved) { var n = parseInt(saved, 10); if (n >= MIN && n <= MAX) sizeInput.value = n; }
  } catch (e) {}

  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

  function currentSize() {
    var n = parseInt(sizeInput.value, 10);
    if (isNaN(n)) n = 300;
    if (n < MIN) n = MIN;
    if (n > MAX) n = MAX;
    return n;
  }

  function applySize() {
    var s = currentSize();
    var previews = gallery.querySelectorAll('.preview');
    for (var i = 0; i < previews.length; i++) {
      previews[i].style.width = s + 'px';
      previews[i].style.height = s + 'px';
    }
    var caps = gallery.querySelectorAll('.card-caption');
    for (var j = 0; j < caps.length; j++) { caps[j].style.width = s + 'px'; }
    try { localStorage.setItem('hyoji:size', String(s)); } catch (e) {}
  }

  function setSize(n) {
    if (n < MIN) n = MIN;
    if (n > MAX) n = MAX;
    sizeInput.value = n;
    applySize();
  }

  sizeMinus.addEventListener('click', function () { setSize(currentSize() - STEP); });
  sizePlus.addEventListener('click', function () { setSize(currentSize() + STEP); });
  sizeInput.addEventListener('change', function () { setSize(currentSize()); });
  sizeInput.addEventListener('input', function () {
    var n = parseInt(sizeInput.value, 10);
    if (!isNaN(n) && n >= MIN && n <= MAX) applySize();
  });

  function render() {
    var s = currentSize();
    gallery.innerHTML = '';
    if (items.length === 0) {
      result.style.display = 'none';
      clearAllBtn.style.display = 'none';
      return;
    }
    result.style.display = 'block';
    clearAllBtn.style.display = 'inline-flex';

    items.forEach(function (it) {
      var w = it.w, h = it.h;
      var g = gcd(w, h) || 1;
      var rw = Math.round(w / g), rh = Math.round(h / g);
      var ratio = (rw > 50 || rh > 50) ? ((w / h).toFixed(2) + ' : 1') : (rw + ':' + rh);

      var isSquare = Math.abs(w - h) <= Math.max(w, h) * 0.02;
      var tagCls, tagTxt;
      if (isSquare) { tagCls = 'ok'; tagTxt = '✓ 黒帯なし'; }
      else if (h > w) { tagCls = 'warn'; tagTxt = '⚠ 左右に黒帯'; }
      else { tagCls = 'warn'; tagTxt = '⚠ 上下に黒帯'; }

      var card = document.createElement('div');
      card.className = 'card';

      var prev = document.createElement('div');
      prev.className = 'preview';
      prev.style.width = s + 'px';
      prev.style.height = s + 'px';

      var image = document.createElement('img');
      image.src = it.url;
      image.alt = it.name || '';
      prev.appendChild(image);

      var rm = document.createElement('button');
      rm.className = 'card-remove';
      rm.innerHTML = '×';
      rm.title = 'この画像を外す';
      rm.addEventListener('click', function () {
        items = items.filter(function (x) { return x.id !== it.id; });
        try { URL.revokeObjectURL(it.url); } catch (e) {}
        render();
      });
      prev.appendChild(rm);

      var cap = document.createElement('div');
      cap.className = 'card-caption';
      cap.style.width = s + 'px';
      cap.innerHTML =
        '<span class="fname">' + escapeHtml(it.name || '画像') + '</span>' +
        '<span class="dim">' + w + ' × ' + h + ' px ・ ' + ratio + '</span>' +
        '<span class="tag ' + tagCls + '">' + tagTxt + '</span>';

      card.appendChild(prev);
      card.appendChild(cap);
      gallery.appendChild(card);
    });
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function addFiles(fileList) {
    var arr = Array.prototype.slice.call(fileList);
    var imgs = arr.filter(function (f) { return /^image\//.test(f.type); });
    if (imgs.length === 0) {
      alert('画像ファイルを入れてね（jpg / png / webp など）');
      return;
    }
    var pending = imgs.length;
    imgs.forEach(function (f) {
      var url = URL.createObjectURL(f);
      var probe = new Image();
      probe.onload = function () {
        items.push({ id: ++idc, url: url, w: probe.naturalWidth, h: probe.naturalHeight, name: f.name });
        pending--;
        if (pending === 0) render();
      };
      probe.onerror = function () {
        try { URL.revokeObjectURL(url); } catch (e) {}
        pending--;
        if (pending === 0) render();
      };
      probe.src = url;
    });
  }

  fileInput.addEventListener('change', function (e) {
    if (e.target.files && e.target.files.length) addFiles(e.target.files);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); drop.classList.add('drag'); });
  });
  ['dragleave', 'dragend', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); drop.classList.remove('drag'); });
  });
  drop.addEventListener('drop', function (e) {
    var dt = e.dataTransfer;
    if (dt && dt.files && dt.files.length) addFiles(dt.files);
  });
  ['dragover', 'drop'].forEach(function (ev) {
    window.addEventListener(ev, function (e) { e.preventDefault(); }, false);
  });

  clearAllBtn.addEventListener('click', function () {
    items.forEach(function (it) { try { URL.revokeObjectURL(it.url); } catch (e) {} });
    items = [];
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
